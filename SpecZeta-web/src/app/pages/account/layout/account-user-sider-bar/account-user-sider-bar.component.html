<div class="filter_search_opt">
    <a href="javascript:void(0);" (click)="toggleNavigation()" class="btn btn-dark full-width mb-4">
        Navigation du tableau de bord<i class="fa-solid fa-bars ms-2"></i>
    </a>
</div>

<div class="simple-sidebar sm-sidebar" id="filter_search" [style.display]="showNavigation ? 'block' : null">

    <div class="search-sidebar_header">
        <h4 class="ssh_heading">Fermer le menu</h4>
        <button (click)="closeNavigation()" class="w3-bar-item w3-button w3-large">
            <i class="fa-regular fa-circle-xmark fs-5 text-muted-2"></i>
        </button>
    </div>

    <div class="sidebar-widgets">
        <div class="dashboard-navbar">

            <div class="d-user-avater">
                <img [src]="currentUser?.photoUrl || avatarPlaceholder" (error)="onAvatarError($event)"
                    class="img-fluid avater" [alt]="currentUser?.pseudo || 'Avatar'">
                <h4>{{ currentUser?.pseudo || 'Mon compte' }}</h4>
                <span *ngIf="currentUser?.ville">{{ currentUser?.ville }}</span>
            </div>

            <div class="d-navigation">
                <ul>
                    <li routerLinkActive="active"><a routerLink="/dashboard"><i class="fa-solid fa-gauge"></i>Tableau de
                            bord</a></li>
                    <li routerLinkActive="active"><a routerLink="/annonce-user-list"><i class="fa-solid fa-list"></i>Mes
                            annonces</a></li>
                    <li routerLinkActive="active"><a routerLink="/create-annonce"><i class="fa-solid fa-plus"></i>Publier
                            une annonce</a></li>
                    <li routerLinkActive="active"><a routerLink="/annonce-list"><i class="fa-solid fa-store"></i>Toutes
                            les annonces</a></li>
                    <li><a href="javascript:void(0);" (click)="logout()"><i class="fa-solid fa-power-off"></i>Se
                            déconnecter</a></li>
                </ul>
            </div>

        </div>
    </div>

</div>
